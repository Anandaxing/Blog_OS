[package]
name = "blog_os"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader = "0.9"
# to use volatile writes for the VGA buffer
volatile = "0.2.6"
# to use a spinning mutex
spin = "0.5.2"

[dependencies.lazy_static]
version = "1.0"
# we need spin no std since we don't link the standard library
features = ["spin_no_std"] 